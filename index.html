<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Universal Data AI</title>
    <!-- Stlite CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable/build/stlite.css" />
  </head>
  <body>
    <div id="root" style="height: 100vh;"></div>
    <!-- Stlite JS -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas", "matplotlib"],
          entrypoint: "stlite_app.py",
          files: {
            "stlite_app.py": {
              url: "./stlite_app.py"
            }
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
