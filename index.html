<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Tabular Data Analyser</title>
    <!-- Stlite CSS (version pinned; update deliberately and re-test) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
    <style>
      /* Startup note: shown until the app has drawn its title, then removed. */
      #startup-note {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;
        max-width: min(560px, calc(100vw - 32px)); box-sizing: border-box;
        padding: 12px 16px; border-radius: 8px; border: 1px solid #CFCFCE; border-left: 4px solid #036493;
        background: #FFFFFF; color: #333232; font: 14px/1.45 Arial, Helvetica, sans-serif;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); pointer-events: none;
      }
      #startup-note strong { display: block; margin-bottom: 2px; color: #036493; }
      body { background: #FFFFFF; }
      /* stlite's loading notifications can get stuck on screen if the tab was in the background while
         loading (their dismiss animation never runs). Hide them once the app is ready; errors stay visible. */
      body.app-ready .Toastify__toast:not(.Toastify__toast--error) { display: none !important; }
    </style>
  </head>
  <body>
    <div id="startup-note" role="status" aria-live="polite">
      <strong>Starting the Tabular Data Analyser…</strong>
      <span id="startup-detail">Python is being set up inside your browser so your data never leaves your computer.
        The first visit can take up to a minute; later visits are usually quicker.</span>
    </div>
    <div id="root" style="height: 100vh;"></div>
    <script>
      // Remove the startup note once the app's title appears; if loading takes very long, say so.
      (function () {
        var note = document.getElementById("startup-note");
        var ready = function () { return document.querySelector("#root h1"); };
        var observer = new MutationObserver(function () {
          if (ready()) {
            note.remove(); observer.disconnect(); clearTimeout(slow);
            setTimeout(function () { document.body.classList.add("app-ready"); }, 4000);
          }
        });
        observer.observe(document.getElementById("root"), { childList: true, subtree: true });
        var slow = setTimeout(function () {
          if (document.body.contains(note)) {
            document.getElementById("startup-detail").textContent =
              "Still starting… this is taking longer than usual. If nothing appears soon, check your internet " +
              "connection and reload the page.";
          }
        }, 120000);
      })();
    </script>
    <!-- Stlite JS -->
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
      mount(
        {
          requirements: ["pandas", "matplotlib", "openpyxl"],
          entrypoint: "stlite_app.py",
          // Every Python file the app uses must be listed here.
          files: {
            "stlite_app.py": { url: "./stlite_app.py" },
            "csvanalyser/__init__.py": { url: "./csvanalyser/__init__.py" },
            "csvanalyser/analysis.py": { url: "./csvanalyser/analysis.py" },
            "csvanalyser/audit.py": { url: "./csvanalyser/audit.py" },
            "csvanalyser/export.py": { url: "./csvanalyser/export.py" },
            "csvanalyser/gemini.py": { url: "./csvanalyser/gemini.py" },
            "csvanalyser/loading.py": { url: "./csvanalyser/loading.py" },
            "csvanalyser/privacy.py": { url: "./csvanalyser/privacy.py" },
            "csvanalyser/profiling.py": { url: "./csvanalyser/profiling.py" },
            "csvanalyser/prompts.py": { url: "./csvanalyser/prompts.py" },
            "csvanalyser/sample.py": { url: "./csvanalyser/sample.py" },
            "csvanalyser/sandbox.py": { url: "./csvanalyser/sandbox.py" },
            "csvanalyser/suggestions.py": { url: "./csvanalyser/suggestions.py" },
            "csvanalyser/tour.py": { url: "./csvanalyser/tour.py" }
          },
          // CEEW brand colours on a white page: blue family only (never mix primary colours), CEEW grey text.
          // Buttons use the blue shade #036493 because white text on the main blue #029BD6 lacks contrast.
          // The sidebar and input boxes use a very light neutral grey so they stand out from the page.
          streamlitConfig: {
            "theme.base": "light",
            "theme.primaryColor": "#036493",
            "theme.backgroundColor": "#FFFFFF",
            "theme.secondaryBackgroundColor": "#F0F2F6",
            "theme.textColor": "#333232",
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
