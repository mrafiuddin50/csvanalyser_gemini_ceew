<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Tabular Data Analyser</title>
    <!-- Stlite CSS (version pinned; update deliberately and re-test) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
  </head>
  <body>
    <div id="root" style="height: 100vh;"></div>
    <!-- Stlite JS -->
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
      mount(
        {
          requirements: ["pandas", "matplotlib", "openpyxl"],
          entrypoint: "stlite_app.py",
          // Every Python file the app uses must be listed here.
          files: {
            "stlite_app.py": { url: "./stlite_app.py" },
            "csvanalyser/__init__.py": { url: "./csvanalyser/__init__.py" },
            "csvanalyser/analysis.py": { url: "./csvanalyser/analysis.py" },
            "csvanalyser/audit.py": { url: "./csvanalyser/audit.py" },
            "csvanalyser/export.py": { url: "./csvanalyser/export.py" },
            "csvanalyser/gemini.py": { url: "./csvanalyser/gemini.py" },
            "csvanalyser/loading.py": { url: "./csvanalyser/loading.py" },
            "csvanalyser/privacy.py": { url: "./csvanalyser/privacy.py" },
            "csvanalyser/profiling.py": { url: "./csvanalyser/profiling.py" },
            "csvanalyser/prompts.py": { url: "./csvanalyser/prompts.py" },
            "csvanalyser/sample.py": { url: "./csvanalyser/sample.py" },
            "csvanalyser/sandbox.py": { url: "./csvanalyser/sandbox.py" }
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
